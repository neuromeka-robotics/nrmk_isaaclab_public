isaaclab_task: "Zen-Deploy"

communication:
  topic_namespace: "zen_sim"
  zenoh: null

simulation:
  real_time: true
  max_steps: null

commands:
  - topic: "base_command"
    dtype: "float32"
    action_slice: [0, 2]
  - topic: "body_command"
    dtype: "float32"
    action_slice: [2, 7]
  - topic: "arm_command"
    dtype: "float32"
    action_slice: [7, 19]

observations:
  root: "obs"

keyboard:
  command_topic: "base_command"
  linear_speed: 1.0
  yaw_speed: 1.0
  debug_vis: false
